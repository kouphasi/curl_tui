[package]
name = "curl_tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
